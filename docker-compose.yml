services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    ports:
      - "5432:5432"
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: nestjs-app
    ports:
      - '3000:3000'
    env_file:
      - .env           
    depends_on:
      - db      
    restart: unless-stopped


volumes:
  postgres_data: